name: build-esp32s3

on:
  push:
    branches:
      - main
      - implementation/**
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.1
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32s3
          idf.py build
      - name: Create flash-at-0 factory image
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          esptool.py --chip esp32s3 merge_bin \
            --flash_mode dio --flash_freq 80m --flash_size 16MB \
            -o build/PRISMA-PI-LITE-ESP32S3-FACTORY.bin \
            0x0 build/bootloader/bootloader.bin \
            0x8000 build/partition_table/partition-table.bin \
            0x10000 build/prisma_pi_lite_esp32s3.bin
      - uses: actions/upload-artifact@v4
        with:
          name: PRISMA-PI-LITE-ESP32S3
          path: |
            build/PRISMA-PI-LITE-ESP32S3-FACTORY.bin
            build/prisma_pi_lite_esp32s3.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/flash_args
