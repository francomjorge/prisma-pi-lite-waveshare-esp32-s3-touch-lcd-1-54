# PRISMA-PI v1.1 ADMIN READ-ONLY
name: ESP-IDF build

on:
  push:
    branches: [main, m4.3-consolidated, m4.3-web4-readonly, m4.4-page2-bidirectional, m4.5-unified-build58-sync, m4.6-page2-build58-readonly, m4.7-page2-direct-readonly, m4.8-sync-lab, m4.9-global-web-sync, m4.10-clean-assets, m4.11-correct-assets-ci, m4.11-controller-stable, v5.0-no-effect-no-admin, v1.0-stable-power, v1.0-web-keyboard-nav, v1.0-liveview-rotate-key, v1.1-admin-readonly, v1.1-admin-official-telemetry, v0-fxlab-page5, v0-fxlab-rotate, v0-fxengine-infra, v0-fxengine-pixel-v1, v0-fxengine-glitch-v1-fullscreen, v0-fxengine-allfx-v1, v0-checkpoint-a-six-pages-motion, v0-fxlab-unified-pipeline-v1, v0-motionfx-v1-all, v0-master-behavior-v1, v0-intensity-presets-ui-v1, v0-intensity-presets-v2, v0-intensity-presets-v2-pixel-tune, v0-powercycle-reset-v1]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate checkpoint A
        run: python3 tools/test_checkpoint_a.py

      - name: Validate master behavior V1
        run: python3 tools/test_master_behavior_v1.py

      - name: Validate intensity presets V2
        run: python3 tools/test_intensity_presets_v1.py

      - name: Validate power-cycle reset V1
        run: python3 tools/test_powercycle_reset_v1.py

      - name: Validate read-only admin
        run: python3 tools/test_admin_readonly.py

      - name: Install ESP-IDF v5.5.1
        uses: espressif/install-esp-idf-action@v1
        with:
          version: "v5.5.1"

      - name: Build ESP32-S3 firmware
        run: idf.py build
        env:
          IDF_TARGET: esp32s3

      - name: Upload firmware build
        uses: actions/upload-artifact@v4
        with:
          name: prisma-pi-lite-esp32s3
          if-no-files-found: error
          path: |
            build/*.bin
            build/bootloader/*.bin
            build/partition_table/*.bin
            build/flash_args
            build/flasher_args.json
