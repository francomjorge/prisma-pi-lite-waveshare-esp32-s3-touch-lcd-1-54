name: ESP-IDF build

on:
  push:
    branches: [main, m4.3-consolidated, m4.3-web4-readonly, m4.4-page2-bidirectional, m4.5-unified-build58-sync, m4.6-page2-build58-readonly, m4.7-page2-direct-readonly, m4.8-sync-lab, m4.9-global-web-sync, m4.10-clean-assets, m4.11-correct-assets-ci, m4.11-controller-stable, v5.0-no-effect-no-admin, v1.0-stable-power, v1.0-web-keyboard-nav, v1.0-liveview-rotate-key, v1.1-admin-readonly, v1.1-admin-official-telemetry, v0-fxlab-page5, v0-fxlab-rotate, v0-fxengine-infra, v0-fxengine-pixel-v1, v0-fxengine-glitch-v1-fullscreen, v0-fxengine-allfx-v1, v0-checkpoint-a-six-pages-motion, nanopad-v1-infra-home, admin-v2-a1-network, admin-v2-a2-security, admin-v2-a3-filesplus, admin-v2-a4-audio, admin-v2-a4-audio-hotfix, admin-v2-a4-1-volume, admin-v2-a4-1-1-playback, admin-v2-a4-2-mic, factory-audio-v1]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate factory V1
        if: github.ref_name == 'nanopad-v1-infra-home'
        run: python3 tools/test_factory_v1.py

      - name: Validate Admin V2 A1 Network
        if: github.ref_name == 'admin-v2-a1-network'
        run: python3 tools/test_admin_v2_a1_network.py

      - name: Validate Admin V2 A2 Security
        if: github.ref_name == 'admin-v2-a2-security'
        run: python3 tools/test_admin_v2_a2_security.py

      - name: Validate Admin V2 A3 Files+
        if: github.ref_name == 'admin-v2-a3-filesplus'
        run: python3 tools/test_admin_v2_a3_filesplus.py

      - name: Validate Admin V2 A4 Audio
        if: github.ref_name == 'admin-v2-a4-audio' || github.ref_name == 'admin-v2-a4-audio-hotfix'
        run: python3 tools/test_admin_v2_a4_audio.py

      - name: Validate Admin V2 A4.1 Volume
        if: github.ref_name == 'admin-v2-a4-1-volume' || github.ref_name == 'admin-v2-a4-1-1-playback' || github.ref_name == 'admin-v2-a4-2-mic' || github.ref_name == 'factory-audio-v1'
        run: python3 tools/test_admin_v2_a4_1_volume.py

      - name: Validate Admin V2 A4.1.1 Playback
        if: github.ref_name == 'admin-v2-a4-1-1-playback' || github.ref_name == 'admin-v2-a4-2-mic' || github.ref_name == 'factory-audio-v1'
        run: python3 tools/test_admin_v2_a4_1_1_playback.py

      - name: Validate Admin V2 A4.2 MIC / Factory Audio
        if: github.ref_name == 'admin-v2-a4-2-mic' || github.ref_name == 'factory-audio-v1'
        run: python3 tools/test_admin_v2_a4_2_mic.py

      - name: Validate checkpoint A
        if: github.ref_name != 'nanopad-v1-infra-home' && github.ref_name != 'admin-v2-a1-network' && github.ref_name != 'admin-v2-a2-security' && github.ref_name != 'admin-v2-a3-filesplus' && github.ref_name != 'admin-v2-a4-audio' && github.ref_name != 'admin-v2-a4-audio-hotfix' && github.ref_name != 'admin-v2-a4-1-volume' && github.ref_name != 'admin-v2-a4-1-1-playback' && github.ref_name != 'admin-v2-a4-2-mic' && github.ref_name != 'factory-audio-v1'
        run: python3 tools/test_checkpoint_a.py

      - name: Validate legacy admin
        if: github.ref_name != 'nanopad-v1-infra-home' && github.ref_name != 'admin-v2-a1-network' && github.ref_name != 'admin-v2-a2-security' && github.ref_name != 'admin-v2-a3-filesplus' && github.ref_name != 'admin-v2-a4-audio' && github.ref_name != 'admin-v2-a4-audio-hotfix' && github.ref_name != 'admin-v2-a4-1-volume' && github.ref_name != 'admin-v2-a4-1-1-playback' && github.ref_name != 'admin-v2-a4-2-mic' && github.ref_name != 'factory-audio-v1'
        run: python3 tools/test_admin_readonly.py

      - name: Install ESP-IDF v5.5.1
        uses: espressif/install-esp-idf-action@v1
        with:
          version: "v5.5.1"

      - name: Build ESP32-S3 firmware
        shell: bash
        run: |
          set -o pipefail
          idf.py build 2>&1 | tee build.log
        env:
          IDF_TARGET: esp32s3

      - name: Build factory V1 single BIN
        if: success() && github.ref_name == 'nanopad-v1-infra-home'
        run: |
          idf.py merge-bin -o prisma-pi-lite-factory-v1.bin -f raw
          test -f build/prisma-pi-lite-factory-v1.bin

      - name: Build Admin V2 A1 single BIN
        if: success() && github.ref_name == 'admin-v2-a1-network'
        run: |
          idf.py merge-bin -o prisma-pi-lite-admin-v2-a1-network.bin -f raw
          test -f build/prisma-pi-lite-admin-v2-a1-network.bin

      - name: Build Admin V2 A2 single BIN
        if: success() && github.ref_name == 'admin-v2-a2-security'
        run: |
          idf.py merge-bin -o prisma-pi-lite-admin-v2-a2-security.bin -f raw
          test -f build/prisma-pi-lite-admin-v2-a2-security.bin

      - name: Build Admin V2 A3 single BIN
        if: success() && github.ref_name == 'admin-v2-a3-filesplus'
        run: |
          idf.py merge-bin -o prisma-pi-lite-admin-v2-a3-filesplus.bin -f raw
          test -f build/prisma-pi-lite-admin-v2-a3-filesplus.bin

      - name: Build Admin V2 A4 single BIN
        if: success() && github.ref_name == 'admin-v2-a4-audio'
        run: |
          idf.py merge-bin -o prisma-pi-lite-admin-v2-a4-audio.bin -f raw
          test -f build/prisma-pi-lite-admin-v2-a4-audio.bin

      - name: Build Admin V2 A4 hotfix single BIN
        if: success() && github.ref_name == 'admin-v2-a4-audio-hotfix'
        run: |
          idf.py merge-bin -o prisma-pi-lite-admin-v2-a4-audio-hotfix.bin -f raw
          test -f build/prisma-pi-lite-admin-v2-a4-audio-hotfix.bin

      - name: Build Admin V2 A4.1 volume single BIN
        if: success() && github.ref_name == 'admin-v2-a4-1-volume'
        run: |
          idf.py merge-bin -o prisma-pi-lite-admin-v2-a4-1-volume.bin -f raw
          test -f build/prisma-pi-lite-admin-v2-a4-1-volume.bin

      - name: Package A4.1 volume upgrade preserving files and NVS
        if: success() && github.ref_name == 'admin-v2-a4-1-volume'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/upgrade
          cp build/bootloader/bootloader.bin dist/upgrade/bootloader.bin
          cp build/partition_table/partition-table.bin dist/upgrade/partition-table.bin
          app_bin="build/prisma_pi_lite_esp32s3.bin"
          test -f "$app_bin"
          cp "$app_bin" dist/upgrade/prisma-pi-lite-admin-v2-a4-1-volume-app.bin
          cat > dist/upgrade/FLASH.txt <<'EOF'
          PRISMA-PI LITE ADMIN V2 A4.1 - VOLUME CONTROL UPGRADE

          This upgrade is designed to preserve the existing NVS and /storage data.
          Do NOT run erase_flash.
          Do NOT flash storage.bin.
          The partition layout is unchanged from the A4 Audio Hotfix baseline.

          From this directory, run:
          python -m esptool --chip esp32s3 --baud 460800 write_flash 0x0 bootloader.bin 0x8000 partition-table.bin 0x10000 prisma-pi-lite-admin-v2-a4-1-volume-app.bin

          If the partition layout was modified outside this branch, stop and verify it before flashing.
          EOF
          (cd dist/upgrade && zip -q -j ../../prisma-pi-lite-admin-v2-a4-1-volume-upgrade-preserve-files.zip bootloader.bin partition-table.bin prisma-pi-lite-admin-v2-a4-1-volume-app.bin FLASH.txt)
          sha256sum build/prisma-pi-lite-admin-v2-a4-1-volume.bin prisma-pi-lite-admin-v2-a4-1-volume-upgrade-preserve-files.zip > SHA256SUMS-A4.1.txt

      - name: Build Admin V2 A4.1.1 playback single BIN
        if: success() && github.ref_name == 'admin-v2-a4-1-1-playback'
        run: |
          idf.py merge-bin -o prisma-pi-lite-admin-v2-a4-1-1-playback.bin -f raw
          test -f build/prisma-pi-lite-admin-v2-a4-1-1-playback.bin

      - name: Package A4.1.1 playback upgrade preserving files and NVS
        if: success() && github.ref_name == 'admin-v2-a4-1-1-playback'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist/upgrade
          mkdir -p dist/upgrade
          cp build/bootloader/bootloader.bin dist/upgrade/bootloader.bin
          cp build/partition_table/partition-table.bin dist/upgrade/partition-table.bin
          app_bin="build/prisma_pi_lite_esp32s3.bin"
          test -f "$app_bin"
          cp "$app_bin" dist/upgrade/prisma-pi-lite-admin-v2-a4-1-1-playback-app.bin
          cat > dist/upgrade/FLASH.txt <<'EOF'
          PRISMA-PI LITE ADMIN V2 A4.1.1 - PLAYBACK HOTFIX

          Fixes selected-WAV playback, Safari/iPhone audio preview byte ranges,
          and file download Content-Length reporting.

          This upgrade preserves the existing NVS and /storage data.
          Do NOT run erase_flash.
          Do NOT flash storage.bin.

          From this directory, run:
          python -m esptool --chip esp32s3 --baud 460800 write_flash 0x0 bootloader.bin 0x8000 partition-table.bin 0x10000 prisma-pi-lite-admin-v2-a4-1-1-playback-app.bin
          EOF
          (cd dist/upgrade && zip -q -j ../../prisma-pi-lite-admin-v2-a4-1-1-playback-upgrade-preserve-files.zip bootloader.bin partition-table.bin prisma-pi-lite-admin-v2-a4-1-1-playback-app.bin FLASH.txt)
          sha256sum build/prisma-pi-lite-admin-v2-a4-1-1-playback.bin prisma-pi-lite-admin-v2-a4-1-1-playback-upgrade-preserve-files.zip > SHA256SUMS-A4.1.1.txt

      - name: Build Admin V2 A4.2 MIC single BIN
        if: success() && github.ref_name == 'admin-v2-a4-2-mic'
        run: |
          idf.py merge-bin -o prisma-pi-lite-admin-v2-a4-2-mic.bin -f raw
          test -f build/prisma-pi-lite-admin-v2-a4-2-mic.bin

      - name: Package A4.2 MIC upgrade preserving files and NVS
        if: success() && github.ref_name == 'admin-v2-a4-2-mic'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist/upgrade
          mkdir -p dist/upgrade
          cp build/bootloader/bootloader.bin dist/upgrade/bootloader.bin
          cp build/partition_table/partition-table.bin dist/upgrade/partition-table.bin
          app_bin="build/prisma_pi_lite_esp32s3.bin"
          test -f "$app_bin"
          cp "$app_bin" dist/upgrade/prisma-pi-lite-admin-v2-a4-2-mic-app.bin
          cat > dist/upgrade/FLASH.txt <<'EOF'
          PRISMA-PI LITE ADMIN V2 A4.2 - MICROPHONE / RECORD

          Adds ES7210 microphone capture on GPIO11, live level monitoring,
          and 1-10 second PCM WAV recording to mic_record.wav.
          Completed recordings are selected automatically in FILES+.

          This upgrade preserves the existing NVS and /storage data.
          Do NOT run erase_flash.
          Do NOT flash storage.bin.

          From this directory, run:
          python -m esptool --chip esp32s3 --baud 460800 write_flash 0x0 bootloader.bin 0x8000 partition-table.bin 0x10000 prisma-pi-lite-admin-v2-a4-2-mic-app.bin
          EOF
          (cd dist/upgrade && zip -q -j ../../prisma-pi-lite-admin-v2-a4-2-mic-upgrade-preserve-files.zip bootloader.bin partition-table.bin prisma-pi-lite-admin-v2-a4-2-mic-app.bin FLASH.txt)
          sha256sum build/prisma-pi-lite-admin-v2-a4-2-mic.bin prisma-pi-lite-admin-v2-a4-2-mic-upgrade-preserve-files.zip > SHA256SUMS-A4.2.txt

      - name: Build Factory Audio V1 single BIN
        if: success() && github.ref_name == 'factory-audio-v1'
        run: |
          idf.py merge-bin -o prisma-pi-lite-factory-audio-v1.bin -f raw
          test -f build/prisma-pi-lite-factory-audio-v1.bin

      - name: Package Factory Audio V1 upgrade preserving files and NVS
        if: success() && github.ref_name == 'factory-audio-v1'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist/upgrade
          mkdir -p dist/upgrade
          cp build/bootloader/bootloader.bin dist/upgrade/bootloader.bin
          cp build/partition_table/partition-table.bin dist/upgrade/partition-table.bin
          app_bin="build/prisma_pi_lite_esp32s3.bin"
          test -f "$app_bin"
          cp "$app_bin" dist/upgrade/prisma-pi-lite-factory-audio-v1-app.bin
          cat > dist/upgrade/FLASH.txt <<'EOF'
          PRISMA-PI LITE - FACTORY AUDIO V1

          Frozen working audio baseline: ES8311 speaker output, WAV playback,
          ES7210 microphone capture, live meter and 1-10 second WAV recording.
          All audio diagnostics and controls are unified under /admin -> AUDIO.
          The legacy /mic route redirects to /admin#audio.

          This upgrade preserves existing NVS, Wi-Fi/security settings and /storage data.
          Do NOT run erase_flash.
          Do NOT flash storage.bin.

          From this directory, run:
          python -m esptool --chip esp32s3 --baud 460800 write_flash 0x0 bootloader.bin 0x8000 partition-table.bin 0x10000 prisma-pi-lite-factory-audio-v1-app.bin
          EOF
          (cd dist/upgrade && zip -q -j ../../prisma-pi-lite-factory-audio-v1-upgrade-preserve-files.zip bootloader.bin partition-table.bin prisma-pi-lite-factory-audio-v1-app.bin FLASH.txt)
          sha256sum build/prisma-pi-lite-factory-audio-v1.bin prisma-pi-lite-factory-audio-v1-upgrade-preserve-files.zip > SHA256SUMS-FACTORY-AUDIO-V1.txt

      - name: Upload firmware build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: prisma-pi-lite-esp32s3
          if-no-files-found: error
          path: |
            build/*.bin
            build/bootloader/*.bin
            build/partition_table/*.bin
            build/flash_args
            build/flasher_args.json
            prisma-pi-lite-admin-v2-a4-1-volume-upgrade-preserve-files.zip
            SHA256SUMS-A4.1.txt
            prisma-pi-lite-admin-v2-a4-1-1-playback-upgrade-preserve-files.zip
            SHA256SUMS-A4.1.1.txt
            prisma-pi-lite-admin-v2-a4-2-mic-upgrade-preserve-files.zip
            SHA256SUMS-A4.2.txt
            prisma-pi-lite-factory-audio-v1-upgrade-preserve-files.zip
            SHA256SUMS-FACTORY-AUDIO-V1.txt

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prisma-pi-lite-build-log
          if-no-files-found: warn
          path: build.log