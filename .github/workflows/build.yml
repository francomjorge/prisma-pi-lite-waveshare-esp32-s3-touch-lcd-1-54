name: ESP-IDF build

on:
  push:
    branches: [main, m4.3-consolidated, m4.3-web4-readonly, m4.4-page2-bidirectional, m4.5-unified-build58-sync, m4.6-page2-build58-readonly, m4.7-page2-direct-readonly, m4.8-sync-lab, m4.9-global-web-sync, m4.10-clean-assets, m4.11-correct-assets-ci, m4.11-controller-stable, v5.0-no-effect-no-admin, v1.0-stable-power, v1.0-web-keyboard-nav, v1.0-liveview-rotate-key, v1.1-admin-readonly, v1.1-admin-official-telemetry, v0-fxlab-page5, v0-fxlab-rotate, v0-fxengine-infra, v0-fxengine-pixel-v1, v0-fxengine-glitch-v1-fullscreen, v0-fxengine-allfx-v1, v0-checkpoint-a-six-pages-motion, nanopad-v1-infra-home, admin-v2-a1-network, admin-v2-a2-security, admin-v2-a3-filesplus]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate factory V1
        if: github.ref_name == 'nanopad-v1-infra-home'
        run: python3 tools/test_factory_v1.py

      - name: Validate Admin V2 A1 Network
        if: github.ref_name == 'admin-v2-a1-network'
        run: python3 tools/test_admin_v2_a1_network.py

      - name: Validate Admin V2 A2 Security
        if: github.ref_name == 'admin-v2-a2-security'
        run: python3 tools/test_admin_v2_a2_security.py

      - name: Validate Admin V2 A3 Files+
        if: github.ref_name == 'admin-v2-a3-filesplus'
        run: python3 tools/test_admin_v2_a3_filesplus.py

      - name: Validate checkpoint A
        if: github.ref_name != 'nanopad-v1-infra-home' && github.ref_name != 'admin-v2-a1-network' && github.ref_name != 'admin-v2-a2-security' && github.ref_name != 'admin-v2-a3-filesplus'
        run: python3 tools/test_checkpoint_a.py

      - name: Validate legacy admin
        if: github.ref_name != 'nanopad-v1-infra-home' && github.ref_name != 'admin-v2-a1-network' && github.ref_name != 'admin-v2-a2-security' && github.ref_name != 'admin-v2-a3-filesplus'
        run: python3 tools/test_admin_readonly.py

      - name: Install ESP-IDF v5.5.1
        uses: espressif/install-esp-idf-action@v1
        with:
          version: "v5.5.1"

      - name: Build ESP32-S3 firmware
        shell: bash
        run: |
          set -o pipefail
          idf.py build 2>&1 | tee build.log
        env:
          IDF_TARGET: esp32s3

      - name: Build factory V1 single BIN
        if: success() && github.ref_name == 'nanopad-v1-infra-home'
        run: |
          idf.py merge-bin -o prisma-pi-lite-factory-v1.bin -f raw
          test -f build/prisma-pi-lite-factory-v1.bin

      - name: Build Admin V2 A1 single BIN
        if: success() && github.ref_name == 'admin-v2-a1-network'
        run: |
          idf.py merge-bin -o prisma-pi-lite-admin-v2-a1-network.bin -f raw
          test -f build/prisma-pi-lite-admin-v2-a1-network.bin

      - name: Build Admin V2 A2 single BIN
        if: success() && github.ref_name == 'admin-v2-a2-security'
        run: |
          idf.py merge-bin -o prisma-pi-lite-admin-v2-a2-security.bin -f raw
          test -f build/prisma-pi-lite-admin-v2-a2-security.bin

      - name: Build Admin V2 A3 single BIN
        if: success() && github.ref_name == 'admin-v2-a3-filesplus'
        run: |
          idf.py merge-bin -o prisma-pi-lite-admin-v2-a3-filesplus.bin -f raw
          test -f build/prisma-pi-lite-admin-v2-a3-filesplus.bin

      - name: Upload firmware build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: prisma-pi-lite-esp32s3
          if-no-files-found: error
          path: |
            build/*.bin
            build/bootloader/*.bin
            build/partition_table/*.bin
            build/flash_args
            build/flasher_args.json

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prisma-pi-lite-build-log
          if-no-files-found: warn
          path: build.log
