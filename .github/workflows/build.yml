name: ESP-IDF build

on:
  push:
    branches: [a4-1-stable-playback-fix, ui-audio-stage1-427, audio-stage2-arp-428, audio-stage3-appliance-arp-430]
  workflow_dispatch:

# Stage 3 build trigger: appliance ARP integration checkpoint (retry 2).

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ESP-IDF v5.5.1
        uses: espressif/install-esp-idf-action@v1
        with:
          version: "v5.5.1"

      - name: Build ESP32-S3 firmware
        shell: bash
        run: |
          set -o pipefail
          idf.py build 2>&1 | tee build.log
        env:
          IDF_TARGET: esp32s3

      - name: Build stable playback single BIN
        run: |
          idf.py merge-bin -o prisma-pi-lite-a4-1-stable-playback-fix.bin -f raw
          test -f build/prisma-pi-lite-a4-1-stable-playback-fix.bin

      - name: Upload firmware build
        uses: actions/upload-artifact@v4
        with:
          name: prisma-pi-lite-a4-1-stable-playback-fix
          if-no-files-found: error
          path: |
            build/*.bin
            build/bootloader/*.bin
            build/partition_table/*.bin
            build/flash_args
            build/flasher_args.json

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prisma-pi-lite-build-log
          if-no-files-found: warn
          path: build.log
